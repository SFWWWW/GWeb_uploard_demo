<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n-tag="upload.title">照片上传 · QR2WebUpload</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="upload-page">
  <div class="upload-wrap">
    <header class="upload-header">
      <div class="brand-lockup">
        <span class="brand-mark">Q2</span>
        <span class="brand-text">QR2WebUpload</span>
      </div>
      <label class="lang-switch">
        <span data-i18n="common.language">语言</span>
        <select data-lang-select aria-label="Language"></select>
      </label>
    </header>

    <main class="upload-card">
      <section id="uploadIntro">
        <div class="upload-hero-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </div>
        <h1 data-i18n="upload.h1">上传今日手册照片</h1>
        <p class="upload-lead" data-i18n="upload.lead">请拍摄完整手册，尽量保持四角可见、光线充足。</p>

        <div id="subjectBar" class="subject-bar"></div>

        <div class="upload-actions">
          <button id="btnCamera" class="action-btn">
            <span class="action-icon icon-indigo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            </span>
            <strong data-i18n="upload.takePhoto">拍照上传</strong>
            <span data-i18n="upload.takePhotoSub">打开手机摄像头</span>
          </button>
          <button id="btnGallery" class="action-btn">
            <span class="action-icon icon-cyan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </span>
            <strong data-i18n="upload.fromGallery">从相册选择</strong>
            <span data-i18n="upload.fromGallerySub">上传已有照片</span>
          </button>
        </div>

        <input id="fileCamera" type="file" accept="image/*" capture="environment" hidden>
        <input id="fileGallery" type="file" accept="image/*" hidden>

        <p class="exif-tip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span data-i18n="upload.exifTip">系统会读取照片中的拍摄时间与位置，请在相机设置中开启定位权限。</span>
        </p>
      </section>

      <section id="previewArea" hidden>
        <div class="preview-head">
          <h2 data-i18n="upload.confirmTitle">确认照片</h2>
          <button id="btnReset" class="btn btn-ghost btn-sm" data-i18n="upload.chooseAgain">重新选择</button>
        </div>
        <div class="preview-image"><img id="previewImg" data-i18n-alt="upload.previewAlt" alt="待上传照片预览"></div>
        <div id="metaChips" class="meta-chips"></div>
        <label class="field"><span data-i18n="upload.noteLabel">备注（选填）</span><input id="noteInput" class="input" data-i18n-ph="upload.notePh" placeholder="例如：第 3 天"></label>
        <button id="btnSubmit" class="btn btn-primary btn-block" data-i18n="upload.submit">确认上传</button>
      </section>

      <section id="successView" hidden>
        <div class="success-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
        </div>
        <h2 data-i18n="upload.successTitle">上传成功</h2>
        <p id="successText" class="success-text"></p>
        <button id="btnAgain" class="btn btn-primary btn-block" data-i18n="upload.again">继续上传一张</button>
      </section>

      <section id="errorView" hidden>
        <div class="error-mark">!</div>
        <h2 data-i18n="upload.errorTitle">未识别到研究对象</h2>
        <p class="success-text" data-i18n="upload.errorLead">请从手册上的二维码进入，或手动输入研究对象编号。</p>
        <div class="pid-entry">
          <input id="pidInput" class="input" data-i18n-ph="upload.pidPh" placeholder="例如 P001" maxlength="16">
          <button id="btnPid" class="btn btn-primary" data-i18n="upload.ok">确定</button>
        </div>
      </section>
    </main>

    <footer class="upload-foot" data-i18n="upload.foot">照片仅用于健康追踪研究 · 演示版本</footer>
  </div>

  <script src="js/i18n.js"></script>
  <script src="vendor/exifr.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
